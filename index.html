<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="おおもじ・こもじ・よみかたを、カードと4たくクイズで れんしゅうできる アルファベットゲーム。">
  <meta name="theme-color" content="#eaf7ff">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/abc-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/abc-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="ABCれんしゅう">
  <title>ABCれんしゅう | kairi_studio</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Barlow, "Hiragino Sans", "Yu Gothic", Meiryo, system-ui, sans-serif;
      color: #202c52; background: #eaf7ff;
      --blue: #2548c5; --ink: #202c52; --muted: #495574; --line: #d6e0f4;
      --mist: #eaf2ff; --white: #fffefa;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; touch-action: manipulation; -webkit-text-size-adjust: 100%; }
    .viewport { height: 100vh; height: 100svh; overflow: auto; overscroll-behavior: contain; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    .frame { position: relative; margin-inline: auto; }
    .viewport, .frame, .shell { touch-action: manipulation; }
    .shell { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    .frame > .shell { position: absolute; top: 0; left: 0; margin: 0; transform-origin: top left; }
    img { -webkit-user-drag: none; pointer-events: none; }
    button, .range { -webkit-tap-highlight-color: transparent; }
    button, input { font: inherit; }
    button { cursor: pointer; touch-action: manipulation; color: inherit; }
    button:disabled { cursor: default; }
    :focus-visible { outline: 3px solid #256baf; outline-offset: 4px; }
    .shell { max-width: 820px; margin: auto; padding: 20px 16px 24px; }
    .top { min-height: 48px; display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
    .brand { display: flex; align-items: center; gap: 9px; font: 750 15px/1.1 Barlow, system-ui, sans-serif; letter-spacing: .025em; }
    .brand-mark { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 10px 10px 10px 3px; background: var(--blue); color: white; font-size: 18px; }
    .panel { background: var(--white); border: 1px solid #cadbf4; border-radius: 26px; overflow: hidden; box-shadow: 0 7px 0 #d0e5fa; }
    .hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .83fr); gap: 16px; align-items: center; padding: 24px 36px; background: #c9edff; border-bottom: 1px solid #badbf5; }
    h1, h2, p { margin: 0; }
    h1 { font-size: clamp(25px, 5.2vw, 43px); line-height: 1.12; letter-spacing: -.045em; }
    h1 b { display: flex; align-items: center; gap: .08em; width: max-content; margin-bottom: .13em; font: 900 clamp(51px, 9vw, 88px)/.98 "Arial Black", Barlow, system-ui, sans-serif; letter-spacing: -.06em; }
    h1 b span { display: inline-block; color: #2548c5; text-shadow: 0 .065em #fff; transform: rotate(-6deg); }
    h1 b span:nth-child(2) { color: #a13359; transform: translateY(.045em) rotate(5deg); }
    h1 b span:nth-child(3) { color: #9a4900; transform: rotate(-4deg); }
    .intro { color: var(--ink); font-size: 14px; font-weight: 650; line-height: 1.6; margin-top: 12px; }
    .cast { position: relative; height: 220px; isolation: isolate; max-width: 360px; width: 100%; margin-inline: auto; }
    .cast::before { content: ''; position: absolute; inset: 11% 18% 8%; background: #ffdc69; border: 3px solid #fff0ac; border-radius: 50%; transform: rotate(-12deg); }
    .cast::after { content: ''; position: absolute; inset: auto 3% 5% 3%; height: 12%; background: #6cadde38; border-radius: 50%; z-index: -1; }
    .cast img { display: block; }
    .nobunaga { position: absolute; bottom: 1%; left: 0; width: 38%; height: 65%; object-fit: contain; transform: rotate(-9deg); }
    .surfer { position: absolute; bottom: 0; left: 22%; width: 61%; height: 100%; object-fit: contain; transform: rotate(5deg); }
    .panda { position: absolute; width: 30%; height: 58%; object-fit: contain; bottom: 2%; right: 0; transform: rotate(6deg); }
    .sparkle { position: absolute; width: 17px; height: 17px; color: #2548c5; background: currentColor; clip-path: polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%); }
    .sparkle:first-of-type { top: 14%; left: 15%; }
    .sparkle:last-of-type { top: 24%; right: 7%; color: #b33b62; transform: scale(.75); }
    .inside { padding: 26px 36px 32px; }
    fieldset { border: 0; margin: 0 0 23px; padding: 0; min-width: 0; }
    legend { padding: 0; margin-bottom: 10px; font-weight: 800; }
    .ranges { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 9px; }
    .range { display: block; position: relative; cursor: pointer; text-align: center; }
    .range input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
    .range span { display: grid; min-height: 64px; align-content: center; gap: 2px; background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 6px 2px; }
    .range b { font: 800 19px/1.15 Barlow, system-ui, sans-serif; }
    .range small { color: var(--muted); font-weight: 700; }
    .range input:checked + span { border-color: var(--blue); background: #e4eaff; color: var(--blue); box-shadow: 0 3px 0 #d4dffa; }
    .range input:focus-visible + span { outline: 3px solid #256baf; outline-offset: 3px; }
    .row { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; }
    .btn { border: 1px solid #cdd9ed; border-radius: 13px; min-height: 48px; padding: 8px 12px; background: white; font-weight: 800; line-height: 1.3; }
    .btn:disabled { background: #f0f3f9; border-color: #e0e6f3; color: #596783; }
    .primary { background: var(--blue); color: white; border-color: var(--blue); }
    .btn:active:not(:disabled), .option:active:not(:disabled) { transform: translateY(1px); }
    @media (hover: hover) {
      .btn:hover:not(:disabled), .option:hover:not(:disabled) { box-shadow: inset 0 0 0 2px #2548c54d; }
      .primary:hover:not(:disabled) { background: #203da5; }
    }
    .mode { min-height: 63px; box-shadow: 0 4px 0 #1d3590; }
    #quiz-start { color: #4d2b00; background: #ffda63; border-color: #edbb3b; box-shadow: 0 4px 0 #e0a62b; }
    .mode small { display: block; margin-top: 4px; font-size: 12px; font-weight: 650; }
    .top .btn { font-size: 12px; }
    .head { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; min-height: 34px; }
    h2 { font-size: clamp(20px, 4.6vw, 27px); line-height: 1.25; }
    h1:focus, h2:focus, .prompt:focus { outline: none; }
    .progress-label { margin-inline-start: auto; color: var(--blue); font-size: 13px; font-weight: 800; white-space: nowrap; }
    progress { display: block; width: 100%; height: 7px; border: 0; border-radius: 8px; appearance: none; background: #e0eafa; margin-bottom: 14px; }
    progress::-webkit-progress-bar { background: #e0eafa; border-radius: 8px; }
    progress::-webkit-progress-value { background: #526fe0; border-radius: 8px; }
    progress::-moz-progress-bar { background: #526fe0; border-radius: 8px; }
    .card { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)) clamp(60px,19vw,132px); text-align: center; border: 1px solid #dbe4fa; border-radius: 18px; background: #e9efff; padding: 15px 10px 12px; margin-bottom: 12px; }
    .card > div + div { border-left: 1px solid #dedccf; }
    .card small { display: block; color: var(--muted); font-size: 13px; font-weight: 800; }
    .letter { display: block; font: 750 clamp(70px, 20vw, 112px)/1.02 Barlow, system-ui, sans-serif; color: var(--blue); }
    #lower { color: #884523; }
    .reading { grid-column: 1 / span 2; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; column-gap: 8px; margin-top: 7px; font-size: clamp(22px, 5vw, 30px); }
    .character { position: relative; display: block; width: 100%; aspect-ratio: 1; align-self: center; overflow: hidden; }
    .character::before { content: ''; position: absolute; inset: 0; border-radius: 50%; }
    .character img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
    .card-mascot { grid-area: 1 / 3 / span 2; }
    .card-mascot::before { background: #ffedaa; }
    .audio { width: 100%; margin-bottom: 10px; }
    .top { flex-wrap: wrap; }
    .effects-sound { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; min-height: 44px; cursor: pointer; font-size: 14px; font-weight: 700; }
    .effects-sound input { accent-color: var(--blue); }
    .audio-note { color: var(--muted); font-size: 12px; margin: 0 0 10px; text-align: center; }
    .prompt { display: grid; grid-template-columns: minmax(0,1fr) clamp(61px,20vw,108px); gap: 2px 6px; place-items: center; align-content: center; text-align: center; min-height: 105px; padding: 9px; background: var(--mist); border: 1px solid #d6e3fa; border-radius: 16px; font-weight: 800; font-size: 14px; margin-bottom: 10px; }
    .quiz-mascot { grid-area: 1 / 2 / span 2; }
    .quiz-mascot::before { background: #dbf3ca; }
    .prompt .letter { font-size: clamp(48px, 13vw, 71px); }
    .prompt .kana { color: var(--blue); font-size: clamp(30px, 8vw, 47px); line-height: 1.15; }
    .options { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; }
    .option { position: relative; min-height: 54px; border: 2px solid var(--line); border-radius: 13px; background: white; font: 750 clamp(25px, 7vw, 39px)/1 Barlow, system-ui, sans-serif; }
    .option.correct { border-color: #24805b; background: #e5f5e9; color: #145a3d; }
    .option.wrong { border-color: #bb513e; background: #fff0e9; color: #8b3528; }
    .option.correct::after, .option.wrong::after { position: absolute; right: 9px; top: 8px; font: 800 17px/1 system-ui; }
    .option.correct::after { content: '✓'; }
    .option.wrong::after { content: '×'; }
    .feedback { min-height: 27px; margin-top: 8px; text-align: center; color: #145a3d; font-size: 15px; font-weight: 800; line-height: 1.45; }
    .feedback.wrong { color: #8b3528; }
    .wide { width: 100%; }
    .score { display: grid; grid-template-columns: minmax(0,1fr) clamp(106px,32vw,186px); align-items: center; text-align: center; border-radius: 18px; background: #fff1bc; border: 1px solid #eed78a; padding: 9px 12px; margin: 10px 0 12px; font-weight: 800; }
    .score strong { font: 800 clamp(45px, 12vw, 72px)/1 Barlow, system-ui, sans-serif; color: var(--blue); }
    .score > span { min-width: 0; }
    #score { display: block; }
    #score-total { display: block; margin-top: 5px; font-size: clamp(12px, 3vw, 16px); white-space: nowrap; }
    .score-mascot { display: block; width: 100%; height: auto; }
    .result-note { color: var(--muted); font-size: 14px; font-weight: 650; text-align: center; margin-bottom: 14px; }
    #retry { margin-bottom: 10px; }
    .credits { margin-top: 18px; text-align: center; font-size: 12px; }
    .credits a { color: var(--muted); text-underline-offset: 3px; }
    @media (max-width: 560px) {
      .hero { grid-template-columns: minmax(0,1fr); gap: 4px; padding: 17px 15px 8px; text-align: center; }
      h1 b { margin-inline: auto; }
      .cast { height: clamp(126px, 37vw, 170px); max-width: 245px; }
      .inside { padding: 17px 15px 20px; }
      .panel { border-radius: 20px; }
      .top { margin-bottom: 9px; }
      fieldset { margin-bottom: 17px; }
      .intro { font-size: 12px; margin-top: 7px; }
    }
    @media (max-height: 640px) and (max-width: 560px) {
      .shell { padding-top: 8px; }
      .top { min-height: 44px; }
      .top .btn { min-height: 44px; }
    }
    @media (max-height: 740px) and (max-width: 560px) {
      .hero { padding-top: 12px; }
      .cast { height: clamp(90px, 26vw, 116px); }
      .inside { padding: 14px 15px 18px; }
      .top { min-height: 44px; margin-bottom: 6px; }
      .shell { padding-top: 8px; padding-bottom: 16px; }
      .credits { margin-top: 12px; }
    }
    @media (orientation: landscape) and (max-height: 560px) {
      .hero { grid-template-columns: minmax(0, 1fr) minmax(0, .75fr); padding: 12px 24px; text-align: left; }
      h1 b { margin-inline: 0; font-size: 54px; }
      h1 { font-size: 27px; }
      .cast { height: 120px; max-width: 220px; }
      .intro { margin-top: 6px; font-size: 12px; }
      .inside { padding: 14px 24px 20px; }
      .top { margin-bottom: 6px; min-height: 40px; }
      .shell { padding-top: 8px; padding-bottom: 14px; }
      .credits { margin-top: 12px; }
    }

    /* The same paper, ink and accent colours carry through all four screens. */
    .viewport { background-color: #f2f5f8; background-image: radial-gradient(#ccd6df 0.8px, transparent 0.9px); background-size: 16px 16px; }
    .panel { background: #fffefa; border-color: #c9d6e3; box-shadow: 0 3px 0 #cbd8e3, 0 14px 36px -22px #25466580; }
    .hero { background-color: #d6f0ff; background-image: repeating-linear-gradient(0deg, transparent 0 26px, #85b7d329 26px 27px); }
    .top { column-gap: 8px; }
    .effects-sound { position: relative; gap: 6px; font-size: 12px; white-space: nowrap; }
    .effects-sound input { appearance: none; position: relative; width: 29px; height: 17px; margin: 0; background: #69768a; border: 1px solid transparent; border-radius: 12px; cursor: pointer; }
    .effects-sound input::before { content: ''; position: absolute; left: 2px; top: 2px; width: 11px; height: 11px; border-radius: 50%; background: white; }
    .effects-sound input:checked { background: var(--blue); }
    .effects-sound input:checked::before { transform: translateX(12px); }
    .top .btn { border-radius: 24px; background: #ffffffed; }
    legend, h2 { letter-spacing: .025em; }
    .range span { border-width: 1px; }
    .range input:checked + span { background: #edf1ff; box-shadow: inset 0 0 0 1px var(--blue); }
    .range input:checked + span::after { content: ''; position: absolute; right: 8px; top: 7px; width: 5px; height: 8px; border: solid var(--blue); border-width: 0 2px 2px 0; transform: rotate(45deg); }
    .range small { font-size: 12px; }
    .mode { position: relative; padding-inline: 12px 23px; font-size: 18px; }
    .mode::after { content: ''; position: absolute; right: 12px; top: 50%; width: 6px; height: 6px; border: solid currentColor; border-width: 2px 2px 0 0; transform: translateY(-50%) rotate(45deg); }
    .mode small { opacity: .93; }
    .progress-label { padding: 4px 10px; border-radius: 20px; background: #edf1ff; font-variant-numeric: tabular-nums; }
    .card, .prompt { background: #f2f6ff; border-color: #cddbf0; border-radius: 18px; }
    .card > div + div { border-color: #cddbf0; }
    .reading { padding-top: clamp(8px, 2.4vw, 22px); }
    .character::before { inset: 7%; }
    .audio { background: #f8faff; color: #304b91; border-color: #cbd8f0; }
    .option { border-width: 1px; box-shadow: 0 2px 0 #dae2ec; }
    .option.correct, .option.wrong { border-width: 2px; box-shadow: none; }
    .score { background: radial-gradient(ellipse at 80% 56%, #ffe18b 0 22%, transparent 23%), #fff4cd; border-color: #ecd89c; }
    .credits a { text-decoration-color: #a1b0c2; }
    @media (max-width: 560px) and (orientation: portrait) {
      .hero { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 2px 5px; text-align: left; padding: 18px 15px; }
      .hero h1 b { margin-inline: 0; font-size: clamp(43px, 12.5vw, 65px); }
      .hero .cast { height: clamp(110px, 32vw, 162px); }
      .intro { text-wrap: pretty; }
    }
    @media (max-width: 370px) {
      .top { gap: 5px; }
      .brand { font-size: 12px; gap: 5px; }
      .brand-mark { width: 24px; height: 26px; }
      .top .btn { padding-inline: 7px; }
    }
    @media (forced-colors: active) {
      .effects-sound input { appearance: auto; }
      .effects-sound input::before { display: none; }
    }
  </style>
</head>
<body>
  <div id="viewport" class="viewport"><div id="frame" class="frame"><div id="game" class="shell">
    <header class="top">
      <div class="brand"><span class="brand-mark" aria-hidden="true">k</span>kairi_studio</div>
      <label class="effects-sound"><input id="effects-sound" type="checkbox" checked>こうかおん</label>
      <button id="home-button" class="btn" type="button" hidden>ホームにもどる</button>
    </header>
    <main class="panel">
      <section id="home">
        <div class="hero">
          <div><h1 tabindex="-1" aria-label="ABCれんしゅう"><b lang="en"><span>A</span><span>B</span><span>C</span></b>れんしゅう</h1><p class="intro">おおもじ・こもじ・よみかたをおぼえよう。</p></div>
          <div class="cast" aria-hidden="true">
            <i class="sparkle"></i><i class="sparkle"></i>
            <img draggable="false" class="nobunaga" src="assets/characters/nobunaga.webp" alt="" width="1254" height="1254">
            <img draggable="false" class="surfer" src="assets/surfer.png" alt="" width="1200" height="1320">
            <img draggable="false" class="panda" src="assets/panda-feet.png" alt="" width="240" height="272">
          </div>
        </div>
        <div class="inside">
          <fieldset id="range-picker">
            <legend>れんしゅうする もじ</legend>
            <div class="ranges">
              <label class="range"><input type="radio" name="range" value="0-5" checked><span><b>A〜E</b><small>5もじ</small></span></label>
              <label class="range"><input type="radio" name="range" value="5-10"><span><b>F〜J</b><small>5もじ</small></span></label>
              <label class="range"><input type="radio" name="range" value="10-15"><span><b>K〜O</b><small>5もじ</small></span></label>
              <label class="range"><input type="radio" name="range" value="15-20"><span><b>P〜T</b><small>5もじ</small></span></label>
              <label class="range"><input type="radio" name="range" value="20-26"><span><b>U〜Z</b><small>6もじ</small></span></label>
              <label class="range"><input type="radio" name="range" value="0-26"><span><b>ぜんぶ</b><small>26もじ</small></span></label>
            </div>
          </fieldset>
          <div class="row">
            <button id="learn-start" class="btn primary mode" type="button">おぼえる<small>もじカード</small></button>
            <button id="quiz-start" class="btn mode" type="button">クイズ<small>4たく・10もん</small></button>
          </div>
        </div>
      </section>
      <section id="learn" class="inside" hidden>
        <div class="head"><h2 tabindex="-1">おぼえる</h2><span id="learn-count" class="progress-label"></span></div>
        <progress id="learn-progress" aria-label="おぼえる すすみぐあい"></progress>
        <div class="card" aria-live="polite" aria-atomic="true">
          <div><small>おおもじ</small><strong id="upper" class="letter" lang="en"></strong></div>
          <div><small>こもじ</small><strong id="lower" class="letter" lang="en"></strong></div>
          <p class="reading"><small>よみかた</small><strong id="reading"></strong></p>
          <span class="character card-mascot" aria-hidden="true"><img draggable="false" id="learn-mascot" alt=""></span>
        </div>
        <button id="speak" class="btn audio" type="button">よみかたをきく</button>
        <p id="audio-note" class="audio-note" role="status" hidden></p>
        <div class="row"><button id="prev" class="btn" type="button">← まえ</button><button id="learn-next" class="btn primary" type="button">つぎ →</button></div>
      </section>
      <section id="quiz" class="inside" hidden>
        <div class="head"><h2 id="quiz-title" tabindex="-1">クイズ</h2><span id="quiz-count" class="progress-label"></span></div>
        <progress id="quiz-progress" aria-label="クイズの すすみぐあい"></progress>
        <p class="prompt" tabindex="-1"><span id="question-instruction"></span><strong id="question-letter"></strong><span class="character quiz-mascot" aria-hidden="true"><img draggable="false" id="quiz-mascot" alt=""></span></p>
        <div id="options" class="options" role="group" aria-label="こたえを えらぶ"></div>
        <p id="feedback" class="feedback" role="status"></p>
        <button id="quiz-next" class="btn primary wide" type="button" disabled>つぎの もんだい →</button>
      </section>
      <section id="result" class="inside" hidden>
        <div class="head"><h2 id="result-title" tabindex="-1">クイズのけっか</h2></div>
        <p class="score"><span><strong id="score"></strong><span id="score-total"></span></span><img draggable="false" class="score-mascot" src="assets/characters/hanzo-full.webp" alt="" width="1254" height="1254" loading="lazy"></p>
        <p id="result-note" class="result-note"></p>
        <button id="retry" class="btn primary wide" type="button">まちがえた もんだいを やりなおす</button>
        <button id="result-home" class="btn wide" type="button">ホームにもどる</button>
      </section>
    </main>
    <footer class="credits"><a href="audio-credits.html">おとの せつめい</a></footer>
  </div>
  </div></div>
  <script>
    'use strict';

    const readings = [
      'エー', 'ビー', 'シー', 'ディー', 'イー', 'エフ', 'ジー', 'エイチ', 'アイ',
      'ジェイ', 'ケイ', 'エル', 'エム', 'エヌ', 'オー', 'ピー', 'キュー', 'アール',
      'エス', 'ティー', 'ユー', 'ヴィー', 'ダブリュー', 'エックス', 'ワイ', 'ズィー'
    ];
    const alphabet = Array.from('ABCDEFGHIJKLMNOPQRSTUVWXYZ', (upper, index) => ({
      upper,
      lower: upper.toLowerCase(),
      reading: readings[index]
    }));
    const questionTypes = [
      { prompt: 'upper', answer: 'lower', instruction: 'こもじをえらぼう' },
      { prompt: 'lower', answer: 'upper', instruction: 'おおもじをえらぼう' },
      { prompt: 'reading', answer: 'upper', instruction: 'このよみかたのおおもじをえらぼう' }
    ];
    const learnCharacters = [
      'assets/characters/devil.png',
      'assets/characters/festival.png',
      'assets/characters/naomasa.webp',
      'assets/characters/honey.png',
      'assets/characters/idol.png',
      'assets/sota.webp',
      'assets/characters/kappa.png',
      'assets/characters/lord.png',
      'assets/characters/shingen.webp',
      'assets/characters/magician.png',
      'assets/characters/phoenix.png',
      'assets/characters/toshiie.webp',
      'assets/characters/punk.png',
      'assets/characters/robot.png',
      'assets/characters/yoshihiro.webp',
      'assets/characters/sage.png',
      'assets/characters/samurai.png',
      'assets/characters/yukimura.webp',
      'assets/characters/santa.png',
      'assets/characters/scientist.png',
      'assets/characters/kanji-kairi.webp',
      'assets/characters/sleepy.png',
      'assets/characters/sumo.png',
      'assets/characters/kanji-kappa.webp',
      'assets/characters/sun.png',
      'assets/characters/thief.png'
    ];
    const quizCharacters = [
      'assets/characters/astronaut.png',
      'assets/characters/hideyoshi.webp',
      'assets/characters/dragon.png',
      'assets/characters/ieyasu.webp',
      'assets/characters/explorer.png',
      'assets/characters/kanbei.webp',
      'assets/characters/firefighter.png',
      'assets/characters/kazutoyo.webp',
      'assets/hero-cactus.png',
      'assets/characters/kenshin.webp',
      'assets/characters/moon.png',
      'assets/characters/masamune.webp',
      'assets/characters/musician.png',
      'assets/characters/mitsuhide.webp',
      'assets/characters/unicorn.png',
      'assets/characters/motonari.webp',
      'assets/characters/wizard.png',
      'assets/characters/angel.png',
      'assets/characters/boxer.png',
      'assets/characters/chef.png'
    ];
    const get = id => document.getElementById(id);
    const screens = ['home', 'learn', 'quiz', 'result'];
    let activeAudio = null;
    const recordings = new Map();
    const prompt = document.querySelector('.prompt');
    let pool = alphabet.slice(0, 5);
    let letterIndex = 0;
    let speechRequest = 0;
    let questions = [];
    let questionIndex = 0;
    let missed = [];
    let reviewing = false;
    let unusedCharacters = [];
    let roundCharacters = [];
    let lastQuizCharacter;
    let currentScreen = 'home';
    let questionRevision = 0;
    let lastAction = -Infinity;
    let fitRequest = 0;

    function onAction(target, action) {
      const button = typeof target === 'string' ? get(target) : target;
      button.addEventListener('click', event => {
        if (button.disabled || button.closest('[hidden]') || event.detail > 1) return;
        const now = performance.now();
        if (now - lastAction < 250) return;
        lastAction = now;
        action(event);
      });
    }

    const tapSound = new Audio('assets/audio/tap.mp3');
    tapSound.preload = 'auto';
    tapSound.volume = 0.4;

    function playTap() {
      if (!get('effects-sound').checked) return;
      stopAudio();
      activeAudio = tapSound;
      tapSound.currentTime = 0;
      tapSound.play().catch(() => {});
    }

    function onNavigation(id, action) {
      onAction(id, event => {
        action(event);
        playTap();
      });
    }

    get('range-picker').addEventListener('change', playTap);

    function fitViewport() {
      const viewport = get('viewport');
      const frame = get('frame');
      const game = get('game');
      const inset = getComputedStyle(viewport);
      const width = viewport.clientWidth - parseFloat(inset.paddingLeft) - parseFloat(inset.paddingRight);
      const height = viewport.clientHeight - parseFloat(inset.paddingTop) - parseFloat(inset.paddingBottom);
      if (width <= 0 || height <= 0) return;
      const layoutWidth = Math.min(820, width);
      game.style.width = layoutWidth + 'px';
      const naturalHeight = game.offsetHeight;
      if (!naturalHeight) return;
      // Measure the untransformed layout: scaling cannot feed back into its height.
      const minScale = window.matchMedia('(pointer: coarse)').matches ? 0.92 : 0.65;
      const scale = Math.max(minScale, Math.min(1, height / naturalHeight));
      game.style.transform = 'scale(' + scale + ')';
      frame.style.width = (layoutWidth * scale) + 'px';
      frame.style.height = Math.ceil(naturalHeight * scale) + 'px';
    }

    function scheduleFit() {
      cancelAnimationFrame(fitRequest);
      fitRequest = requestAnimationFrame(fitViewport);
    }

    function show(screen) {
      currentScreen = screen;
      get('viewport').scrollTop = 0;
      scheduleFit();
      for (const id of screens) get(id).hidden = id !== screen;
      get('home-button').hidden = screen === 'home' || screen === 'result';
      window.scrollTo(0, 0);
      get(screen).querySelector('h1, h2').focus({ preventScroll: true });
    }

    function selection() {
      const [start, end] = document.querySelector('input[name="range"]:checked').value.split('-').map(Number);
      return alphabet.slice(start, end);
    }

    function progress(mode, index, total) {
      get(`${mode}-count`).textContent = `${index + 1} / ${total}`;
      const bar = get(`${mode}-progress`);
      bar.max = total;
      bar.value = index + 1;
    }

    function getRecording(letter) {
      if (!recordings.has(letter)) {
        const recording = new Audio(`assets/audio/recorded-${letter === 'Z' ? 'Z-zee' : letter}.mp3`);
        recording.preload = 'auto';
        recordings.set(letter, recording);
        recording.load();
      }
      return recordings.get(letter);
    }

    function stopAudio() {
      speechRequest += 1;
      if (activeAudio) {
        activeAudio.pause();
        activeAudio.currentTime = 0;
        activeAudio = null;
      }
      get('audio-note').hidden = true;
    }

    function showAudioNote() {
      get('audio-note').textContent = 'おとが でなかったよ。もういちど おしてね。';
      get('audio-note').hidden = false;
    }

    function renderLetter() {
      get('viewport').scrollTop = 0;
      const letter = pool[letterIndex];
      const characterIndex = alphabet.indexOf(letter);
      get('learn-mascot').src = learnCharacters[characterIndex];
      const nextCharacter = learnCharacters[characterIndex + 1];
      if (letterIndex + 1 < pool.length) document.createElement('img').src = nextCharacter;
      stopAudio();
      progress('learn', letterIndex, pool.length);
      for (const key of ['upper', 'lower', 'reading']) get(key).textContent = letter[key];
      get('prev').disabled = letterIndex === 0;
      get('learn-next').textContent = letterIndex === pool.length - 1 ? 'おぼえるをおわる' : 'つぎ →';

    }

    function goHome() {
      stopAudio();
      show('home');
    }

    onNavigation('home-button', goHome);
    onNavigation('result-home', goHome);
    onNavigation('learn-start', () => {
      pool = selection();
      for (const letter of pool) getRecording(letter.upper);
      letterIndex = 0;
      renderLetter();
      show('learn');
    });
    onNavigation('prev', () => {
      if (currentScreen !== 'learn' || letterIndex <= 0) return;
      letterIndex -= 1;
      renderLetter();
      if (letterIndex === 0) get('learn-next').focus({ preventScroll: true });
    });
    onNavigation('learn-next', () => {
      if (currentScreen !== 'learn') return;
      if (letterIndex === pool.length - 1) return goHome();
      letterIndex += 1;
      renderLetter();
    });
    onAction('speak', () => {
      stopAudio();
      const request = speechRequest;
      const recording = getRecording(pool[letterIndex].upper);
      if (recording.error) recording.load();
      recording.currentTime = 0;
      activeAudio = recording;
      const failed = () => {
        if (request === speechRequest) showAudioNote();
      };
      recording.onerror = failed;
      recording.onended = () => {
        if (request === speechRequest && activeAudio === recording) activeAudio = null;
      };
      try {
        recording.play().catch(failed);
      } catch {
        failed();
      }
    });

    function shuffle(items) {
      const shuffled = [...items];
      for (let i = shuffled.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    function makeQuestions() {
      const letters = shuffle(pool);
      const types = shuffle(questionTypes);
      return shuffle(Array.from({ length: 10 }, (_, i) => ({
        type: types[i % types.length],
        letter: letters[i % letters.length]
      })));
    }

    function drawCharacters(count) {
      const characters = unusedCharacters.splice(0, count);
      if (characters.length < count) {
        const available = quizCharacters.filter(art => !characters.includes(art) && art !== lastQuizCharacter);
        unusedCharacters = shuffle(available);
        if (lastQuizCharacter && !characters.includes(lastQuizCharacter)) unusedCharacters.push(lastQuizCharacter);
        characters.push(...unusedCharacters.splice(0, count - characters.length));
      }
      return characters;
    }

    const feedbackSounds = new Map();
    function prepareFeedbackSounds() {
      if (feedbackSounds.size) return;
      for (const name of ['correct', 'wrong']) {
        const sound = new Audio(`assets/audio/${name}.mp3`);
        sound.preload = 'auto';
        feedbackSounds.set(name, sound);
      }
    }

    get('effects-sound').addEventListener('change', () => {
      if (get('effects-sound').checked) prepareFeedbackSounds();
      else stopAudio();
    });

    function startRound(round, isReview) {
      if (get('effects-sound').checked) prepareFeedbackSounds();
      questions = round;
      reviewing = isReview;
      questionIndex = 0;
      missed = [];
      roundCharacters = drawCharacters(questions.length);
      get('quiz-title').textContent = reviewing ? 'ふくしゅう' : 'クイズ';
      renderQuestion();
      show('quiz');
    }

    function renderQuestion() {
      const revision = ++questionRevision;
      const { type, letter } = questions[questionIndex];
      lastQuizCharacter = roundCharacters[questionIndex];
      get('quiz-mascot').src = lastQuizCharacter;
      const nextCharacter = roundCharacters[questionIndex + 1];
      if (nextCharacter) document.createElement('img').src = nextCharacter;
      const answer = letter[type.answer];
      const distractors = shuffle(pool.filter(option => option !== letter)).slice(0, 3);
      progress('quiz', questionIndex, questions.length);
      get('question-instruction').textContent = type.instruction;
      const questionLetter = get('question-letter');
      questionLetter.textContent = letter[type.prompt];
      questionLetter.className = type.prompt === 'reading' ? 'kana' : 'letter';
      questionLetter.lang = type.prompt === 'reading' ? 'ja' : 'en';
      get('feedback').textContent = '';
      get('feedback').className = 'feedback';
      get('quiz-next').disabled = true;
      get('quiz-next').textContent = questionIndex === questions.length - 1 ? 'けっかを みる →' : 'つぎの もんだい →';
      const options = shuffle([letter, ...distractors]).map(option => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'option';
        button.lang = 'en';
        button.textContent = option[type.answer];
        onAction(button, () => {
          if (revision === questionRevision) grade(button, answer);
        });
        return button;
      });
      get('options').replaceChildren(...options);
    }

    function grade(button, answer) {
      if (currentScreen !== 'quiz' || !get('quiz-next').disabled) return;
      const correct = button.textContent === answer;
      if (!correct) {
        missed.push(questions[questionIndex]);
        button.classList.add('wrong');
      }
      for (const option of get('options').children) {
        option.disabled = true;
        if (option.textContent === answer) option.classList.add('correct');
      }
      const { letter } = questions[questionIndex];
      get('feedback').textContent = `${correct ? '○ せいかい！' : '× ちがうよ。'} ${letter.upper}・${letter.lower}・${letter.reading}`;
      get('feedback').classList.toggle('wrong', !correct);
      get('quiz-next').disabled = false;
      get('quiz-next').focus({ preventScroll: true });
      if (get('effects-sound').checked) {
        stopAudio();
        const sound = feedbackSounds.get(correct ? 'correct' : 'wrong');
        activeAudio = sound;
        sound.currentTime = 0;
        sound.play().catch(() => {});
      }
    }

    function renderResult() {
      get('result-title').textContent = reviewing ? 'ふくしゅうのけっか' : 'クイズのけっか';
      get('score').textContent = questions.length - missed.length;
      get('score-total').textContent = ` / ${questions.length} もん せいかい`;
      get('result-note').textContent = missed.length ? `まちがえた ${missed.length} もんを やりなおそう！` : 'ぜんぶ せいかい！';
      get('retry').hidden = missed.length === 0;
      show('result');
    }

    onNavigation('quiz-start', () => {
      pool = selection();
      unusedCharacters = shuffle(quizCharacters.filter(art => art !== lastQuizCharacter));
      if (lastQuizCharacter) unusedCharacters.push(lastQuizCharacter);
      startRound(makeQuestions(), false);
    });
    onNavigation('quiz-next', () => {
      if (currentScreen !== 'quiz' || get('quiz-next').disabled) return;
      stopAudio();
      questionIndex += 1;
      if (questionIndex === questions.length) return renderResult();
      renderQuestion();
      get('viewport').scrollTop = 0;
      prompt.focus({ preventScroll: true });
    });
    onNavigation('retry', () => {
      if (currentScreen === 'result' && missed.length) startRound(missed, true);
    });

    get('game').addEventListener('dragstart', event => event.preventDefault());
    get('game').addEventListener('dblclick', event => event.preventDefault());

    // iOS may interpret a second touch as zoom before a dblclick is emitted.
    // Apply this at document level, including the scroll container and margins.
    let touchStart = null;
    let lastTap = null;
    document.addEventListener('touchstart', event => {
      if (event.touches.length !== 1) {
        touchStart = lastTap = null;
        return;
      }
      const touch = event.touches[0];
      touchStart = { x: touch.clientX, y: touch.clientY, at: performance.now() };
    }, { passive: true, capture: true });
    document.addEventListener('touchmove', event => {
      if (!touchStart || event.touches.length !== 1 ||
          Math.hypot(event.touches[0].clientX - touchStart.x, event.touches[0].clientY - touchStart.y) > 10) {
        touchStart = lastTap = null;
      }
    }, { passive: true, capture: true });
    document.addEventListener('touchcancel', () => {
      touchStart = lastTap = null;
    }, { passive: true, capture: true });
    document.addEventListener('touchend', event => {
      const start = touchStart;
      touchStart = null;
      if (!start || event.touches.length || event.changedTouches.length !== 1 ||
          performance.now() - start.at > 500) {
        lastTap = null;
        return;
      }
      const touch = event.changedTouches[0];
      if (Math.hypot(touch.clientX - start.x, touch.clientY - start.y) > 10) {
        lastTap = null;
        return;
      }
      const tap = { x: touch.clientX, y: touch.clientY, at: performance.now() };
      if (lastTap && tap.at - lastTap.at <= 350 &&
          Math.hypot(tap.x - lastTap.x, tap.y - lastTap.y) <= 40 && event.cancelable) {
        event.preventDefault();
      }
      lastTap = tap;
    }, { passive: false, capture: true });

    window.addEventListener('resize', scheduleFit);
    window.addEventListener('pageshow', scheduleFit);
    window.addEventListener('pagehide', stopAudio);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) stopAudio();
    });
    if ('ResizeObserver' in window) {
      const observer = new ResizeObserver(scheduleFit);
      observer.observe(get('game'));
      observer.observe(get('viewport'));
    }
    scheduleFit();
  </script>
</body>
</html>
